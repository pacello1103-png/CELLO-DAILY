name: DailyCello
options:
  bundleIdPrefix: com.pacello
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  projectFormat: xcode14_0
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  DailyCello:
    type: application
    platform: iOS
    sources:
      - path: ios/DailyCello
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pacello.dailycello
        PRODUCT_NAME: DailyCello
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: ios/DailyCello/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
